version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Sibling repos are unavailable to the isolated updater.
    ignore:
      - dependency-name: glyphic
      - dependency-name: tessel
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
